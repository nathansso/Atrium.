name: Snyk Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    env:
      SNYK_AVAILABLE: ${{ secrets.SNYK_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Report missing Snyk credentials
        if: env.SNYK_AVAILABLE != 'true'
        run: echo "::warning::SNYK_TOKEN is not configured; Snyk scans were skipped."

      - name: Install Snyk CLI in the isolated CI runner
        if: env.SNYK_AVAILABLE == 'true'
        uses: snyk/actions/setup@v1.0.0

      - name: Scan open-source dependencies
        id: snyk_deps
        if: env.SNYK_AVAILABLE == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk-dependencies.sarif

      - name: Scan application source
        id: snyk_code
        if: env.SNYK_AVAILABLE == 'true'
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Upload dependency findings to GitHub Code Scanning
        if: env.SNYK_AVAILABLE == 'true' && hashFiles('snyk-dependencies.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-dependencies.sarif
          category: snyk-open-source

      - name: Upload source findings to GitHub Code Scanning
        if: env.SNYK_AVAILABLE == 'true' && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Monitor main in Snyk
        if: env.SNYK_AVAILABLE == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects --project-name=atrium

      - name: Enforce the high-severity security gate
        if: env.SNYK_AVAILABLE == 'true' && (steps.snyk_deps.outcome == 'failure' || steps.snyk_code.outcome == 'failure')
        run: |
          echo "Snyk found a high-severity issue or could not complete a scan."
          exit 1
